<!DOCTYPE html>
<html>
    <head>
        <title>STYLE HEADING </title>
        <style>
            h1 {
                color:hotpink;
                text-align: center;
                font-style:italic;
            }
        </style>
    </head>
    <body>

        <h1>Alignments and Color in texts using HTML!</h1> 
        <h2 style="color:red; text-align: center;">ROBLOXX</h2>
        <h3 style="color:brown; text-align: center;">ROBLOXX</h3>
        <h4 style="color: springgreen; text-align: center;">ROBLOXX</h4>
        <h5 style="color: crimson; text-align: center;">ROBLOXX</h5>
        <h6 style="color: cadetblue; text-align: center;">ROBLOXX</h6>
          ROBLOXX
    </body>
<div>
    <body style="color:red; text-align: center;">
        <h1>ROBLOXX</h1> 
        <h2>ROBLOXX</h2>
        <h3>ROBLOXX</h3>
        <h4>ROBLOXX</h4>
        <h5>ROBLOXX</h5>
        <h6>ROBLOXX</h6>
    </body>
</div>
</html>
