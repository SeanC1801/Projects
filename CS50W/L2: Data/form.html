<!DOCTYPE html>
<html>
    <head>
       <title>Form</title>
    </head>

    <body>
       <form>

         <div>
             <input type="text" placeholder="Full name" name="name">
             <input type="password" placeholder="Password" name="password">
         </div>

         <div>
            Favorite Color?
            <input type="radio" value="Red" name="color"> Nigguh
            <input type="radio" value="Blue" name="color"> Nigga
            <input type="radio" value="Green" name="color"> Nigger
            <input type="radio" value="Purple" name="color"> Niggesh
         </div>

         <div>
            Where do you live?
            <input list="countries" placeholder="Countries" name="country">
            <datalist id="countries">
               <option value="Home"> 
               <option value="Bahay"> 
               <option value="House"> 
               </option>
            </datalist>
         </div>
         <div>
            <input type="submit">
         </div>

       </form>
    </body>
</html>
