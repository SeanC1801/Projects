<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Career</h1>
    <p id="description">Form</p>

    <form action="" id="survey-form">

        <label id="name-label">Type a Nickname: 
             <input type="text" id="name" placeholder="Add Name" required></label> 

        <label id="email-label">Type your Email: 
             <input type="email" id="email" placeholder="Add Email" required></label> 

        <label id="number-label">Type your Age: 
             <input type="number" id="number" placeholder="Add Age" min="13" max="80" required></label> 

        <select name="dropdown" id="dropdown">
            <option value="">Select an Option</option>
            <option value="1">Basketball 🏀</option>
            <option value="2">Academics 📕</option>
        </select>

        <input type="radio" name="radio" value="radio">Be Fit and Happy
        <input type="radio" name="radio" value="radio">Be Fat and Rich

        <input type="checkbox" name="" id="" value="checkbox">Enjoy Life
        <input type="checkbox" name="" id="" value="checkbox">Have lots of Cash

        <textarea name="Wishes" placeholder="Wishes in Life..."></textarea>
        <input type="submit" id="submit" name="Submit">
    </form>
</body>
</html>
